[project]
name = "gridmamba"
version = "0.1.0"
description = "Probabilistic day-ahead grid-load forecasting with selective state-space models, sparse MoE, and adaptive conformal prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.scripts]
gridmamba = "gridmamba.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridmamba"]

[tool.pytest.ini_options]
testpaths = ["tests"]
